NAME: 'LAM_fccr_0.5_start1_crt'
OUTPUT_DIR: './output/LAM_Dataset'
SHOW_STEP: 100
SAVE_STEP: 5
VALID_STEP: 1
INPUT_SIZE: (32, 32)
COLOR_SPACE: 'RGB'

FCCR:
  WORK: True
  C_TYPE: 'edc'
  START_EPOCH: 1
  GAMMA: 0.5

DATASET:
  DATASET: 'LAMDataset'

BACKBONE:
  TYPE: 'res32'
  IN_CHANNELS: 150
  CIFAR_STEM: True

NETWORK:
  PRETRAINED: True
  PRETRAINED_MODEL: './output/LAM_Dataset/LAM_fccr_0.5_start1_resnet32/models/epoch_200.pth'

MODULE:
  TYPE: 'Identity'

CLASSIFIER:
  TYPE: 'cRT'
  BIAS: True

LOSS:
  LOSS_TYPE: 'CrossEntropy'

TRAIN:
  BATCH_SIZE: 128
  MAX_EPOCH: 30
  NUM_WORKERS: 1
  COMBINER:
    TYPE: 'fccr'
  OPTIMIZER:
    TYPE: 'SGD'
    BASE_LR: 0.01
    MOMENTUM: 0.9
    WEIGHT_DECAY: 5e-4
  LR_SCHEDULER:
    TYPE: 'multistep'
    LR_STEP: [10, 20]
    LR_FACTOR: 0.1
    
  TENSORBOARD:
    ENABLE: True
  SAMPLER:
    TYPE: 'weighted sampler'
    WEIGHTED_SAMPLER:
      TYPE: 'balance'

  DISTRIBUTED: False
  SYNCBN: False

TRANSFORMS:
  TRAIN_TRANSFORMS: ("random_resized_crop", "random_horizontal_flip", "color_jitter")
  TEST_TRANSFORMS: ("shorter_resize_for_crop", "center_crop")

TEST:
  BATCH_SIZE: 64
  NUM_WORKERS: 4
  MODEL_FILE: 'best_model.pth'