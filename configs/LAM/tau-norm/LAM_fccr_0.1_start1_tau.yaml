NAME: 'LAM_fccr_0.1_start1_tau'
OUTPUT_DIR:  './output/LAM_Dataset'
SHOW_STEP: 100
SAVE_STEP: 1
VALID_STEP: 1
INPUT_SIZE: (32, 2)
COLOR_SPACE: 'RGB'

FCCR:
  WORK: True
  C_TYPE: 'edc'
  START_EPOCH: 1
  GAMMA: 0.1

DATASET:
  DATASET: 'LAMDataset'

BACKBONE:
  TYPE: 'res32'
  IN_CHANNELS: 150
  CIFAR_STEM: True

MODULE:
  TYPE: 'Identity'

CLASSIFIER:
  TYPE: 'FC'
  BIAS: True

LOSS:
  LOSS_TYPE: 'CrossEntropy'

TRAIN:
  BATCH_SIZE: 128
  MAX_EPOCH: 200
  NUM_WORKERS: 1
  COMBINER:
    TYPE: 'fccr'
  OPTIMIZER:
    TYPE: 'SGD'
    BASE_LR: 0.01
    MOMENTUM: 0.9
    WEIGHT_DECAY: 1e-4
  LR_SCHEDULER:
    TYPE: 'multistep'
    LR_STEP: [160, 180]
    LR_FACTOR: 0.01
  TENSORBOARD:
    ENABLE: True
  SAMPLER:
    TYPE: 'default'

  DISTRIBUTED: False
  SYNCBN: False

TRANSFORMS:
  TRAIN_TRANSFORMS: ("random_resized_crop", "random_horizontal_flip", "color_jitter")
  TEST_TRANSFORMS: ("shorter_resize_for_crop", "center_crop")

TEST:
  BATCH_SIZE: 64
  NUM_WORKERS: 4
  MODEL_FILE: 'best_model.pth'
  TAU_NORM:
    USE_TAU_NORM: True
    TAU: 1.0