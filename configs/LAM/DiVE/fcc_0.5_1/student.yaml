NAME: 'LAM_dive_student_fcc_0.5_start1'
OUTPUT_DIR: './output/LAM_Dataset'
SHOW_STEP: 100
SAVE_STEP: 5
VALID_STEP: 1
INPUT_SIZE: (32, 32)
COLOR_SPACE: 'RGB'

DATASET:
  DATASET: 'LAMDataset'

BACKBONE:
  TYPE: 'res32'
  IN_CHANNELS: 150
  CIFAR_STEM: True

MODULE:
  TYPE: 'Identity'

CLASSIFIER:
  TYPE: 'FC'
  BIAS: True

LOSS:
  LOSS_TYPE: 'DiVEKLD'
  DiVEKLD:
    TEMPERATURE: 2.0
    POWER_NORM: True
    POWER: 0.5
    ALPHA: 0.5
    BASELOSS: 'BalancedSoftmaxCE'

TRAIN:
  BATCH_SIZE: 128
  MAX_EPOCH: 200
  NUM_WORKERS: 1
  COMBINER:
    TYPE: 'dive'
    DIVE:
      TEACHER_MODEL: './output/LAM_Dataset/LAM_dive_teacher_fcc_0.5_start1/models/epoch_200.pth'

  OPTIMIZER:
    TYPE: 'SGD'
    BASE_LR: 0.01
    MOMENTUM: 0.9
    WEIGHT_DECAY: 2e-4
  LR_SCHEDULER:
    TYPE: 'warmup'
    LR_STEP: [120, 160]
    LR_FACTOR: 0.01
    WARM_EPOCH: 5

  TENSORBOARD:
    ENABLE: True
  SAMPLER:
    TYPE: 'default'

  DISTRIBUTED: False
  SYNCBN: True

TRANSFORMS:
  TRAIN_TRANSFORMS: ('random_crop', 'random_horizontal_flip')
  TEST_TRANSFORMS: ()

TEST:
  BATCH_SIZE: 64
  NUM_WORKERS: 8
  MODEL_FILE: 'best_model.pth'