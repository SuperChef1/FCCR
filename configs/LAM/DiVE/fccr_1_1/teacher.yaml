NAME: 'LAM_dive_teacher_fccr_1_start1'
OUTPUT_DIR: './output/LAM_Dataset'
SHOW_STEP: 100
SAVE_STEP: 5
VALID_STEP: 1
INPUT_SIZE: (32, 32)
COLOR_SPACE: 'RGB'

FCCR:
  WORK: True
  C_TYPE: 'edc'
  START_EPOCH: 1
  GAMMA: 1.0

DATASET:
  DATASET: 'LAMDataset'

BACKBONE:
  TYPE: 'res32'
  IN_CHANNELS: 150
  CIFAR_STEM: True


MODULE:
  TYPE: 'Identity'

CLASSIFIER:
  TYPE: 'FC'
  BIAS: True

LOSS:
  LOSS_TYPE: 'BalancedSoftmaxCE'

TRAIN:
  BATCH_SIZE: 128
  MAX_EPOCH: 200
  NUM_WORKERS: 1
  COMBINER:
    TYPE: 'fccr'

  OPTIMIZER:
    TYPE: 'SGD'
    BASE_LR: 0.01
    MOMENTUM: 0.9
    WEIGHT_DECAY: 2e-4
  LR_SCHEDULER:
    TYPE: 'warmup'
    LR_STEP: [120, 160]
    LR_FACTOR: 0.01
    WARM_EPOCH: 5
  TENSORBOARD:
    ENABLE: True
  SAMPLER:
    TYPE: 'default'

  DISTRIBUTED: False
  SYNCBN: True

TRANSFORMS:
  TRAIN_TRANSFORMS: ()
  TEST_TRANSFORMS: ()

TEST:
  BATCH_SIZE: 64
  NUM_WORKERS: 8
  MODEL_FILE: 'best_model.pth'